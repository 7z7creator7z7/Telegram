services:
  - type: web
    name: telegram-zero
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-zero-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: DEFAULT_CHANNEL
        value: "@Barcha_Kontent"
databases:
  - name: telegram-zero-db
    plan: free
